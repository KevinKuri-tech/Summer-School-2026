[theme]
# 18px instead of Streamlit's 16px default. Heading sizes are pinned below the
# stock values because heading rems resolve against this larger base, so leaving
# them alone would make st.title/st.subheader jump much further than the body.
baseFontSize = 18
headingFontSizes = ["2.1rem", "1.6rem", "1.25rem"]
base = "dark"
primaryColor = "#FF4B4B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"